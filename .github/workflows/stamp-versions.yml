# When CSS or JS changes, update the ?v= fingerprints in the HTML pages so visitors
# never get a new page paired with an old cached script. See scripts/stamp_versions.py.
name: Stamp asset versions

on:
  push:
    branches: [main]
    paths:
      - "css/**"
      - "js/**"
      - "*.html"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: site-maintenance
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python scripts/stamp_versions.py

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Versions already up to date."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- "*.html"
          git commit -m "Update asset version fingerprints"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made by this workflow don't trigger a Pages rebuild on their own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will redeploy."
