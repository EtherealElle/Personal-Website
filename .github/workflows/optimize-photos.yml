# After photos are added or the gallery is edited (e.g. through Pages CMS), shrink any
# oversized photos, record photo sizes in data/gallery.json, and redeploy the site.
name: Optimize photos

on:
  push:
    branches: [main]
    paths:
      - "images/work/**"
      - "data/gallery.json"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: optimize-photos
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow

      - run: python scripts/optimize_photos.py

      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A images/work data/gallery.json gallery.html
          git commit -m "Optimize photos and record sizes"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Commits made by this workflow don't trigger a Pages rebuild on their own
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will redeploy."
